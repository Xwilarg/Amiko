syntax = "proto3";

message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
}

message TargetType {
    MessageType type = 1;
}

message Message {
    MessageType type = 1;
    string name = 2;
    string content = 3;
    Timestamp sentAt = 4;
}

message MessageValidation {
    bool validation = 1;
}

message MessageArray {
    MessageType type = 1;
    repeated Message messages = 2;
}

enum MessageType {
    MESSAGE = 1;
    MESSAGELIST = 2;
}