<!--index.html-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <!--<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:5129 ws://localhost:5129 https://amiko.zirk.eu ws://amiko.zirk.eu; script-src 'self' 'unsafe-eval'">-->
        <title>Amiko</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./js/index.js"></script>
        <script src="./js/platform/browser.js"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0">
        <link rel="stylesheet" href="./node_modules/bulma/css/bulma.min.css">
        <link rel="stylesheet" href="./css/main.css">
        <link rel="stylesheet" href="./css/options/regular.css" id="user-style">
    </head>
    <body>
        <div class="modal is-active" id="login-popup">
            <div class="modal-background"></div>
            <div class="modal-content">
                <form class="field">
                    <div class="field">
                        <label class="label">Password</label>
                        <div class="control">
                            <input id="password" class="input" type="password" placeholder="Password">
                        </div>
                    </div>
                    <p class="control">
                        <input class="button is-link" type="submit" id="password-submit">
                    </p>
                </form>
            </div>
        </div>

        <template id="message-template">
            <div class="container message is-flex-grow-0">
                <div class="is-flex">
                    <div class="pfp"></div>
                    <div class="message-main">
                        <small class="date"></small>
                        <h2 class="subtitle"></h2>
                        <p class="content"></p>
                    </div>
                </div>
                <div class="rich-preview is-flex is-hidden"></div>
            </div>
        </template>
        <nav class="navbar">
            <div class="navbar-brand">
                <button class="navbar-item" id="toggle-home">
                    <span class="material-symbols-outlined notif-container">
                        home
                        <span id="notif-global" class="notif"></span>
                    </span>
                </button>
                <button class="navbar-item" id="toggle-settings">
                    <span class="material-symbols-outlined">settings</span>
                </button>
                <button class="navbar-item" id="toggle-profile">
                    <span class="material-symbols-outlined">person</span>
                </button>
                <div class="level is-mobile">
                    <h3 class="subtitle" id="channel-title"></h3>
                </div>
            </div>
        </nav>
        <div id="home-dropdown" class="dropdown is-hidden">
            <div>
                <div id="servers"></div>
                <hr>
                <div id="channels"></div>
            </div>
        </div>
        <div id="settings-dropdown" class="dropdown is-hidden">
            <div>
                <div id="style-selection" class="select">
                    <select id="style-selection-select">
                        <option value="regular">Default</option>
                        <option value="minimalist">Minimalist</option>
                    </select>
                </div>
                <br>
                <button class="button is-primary" id="export-button" disabled>Export</button>
            </div>
        </div>
        <div id="profile-dropdown" class="dropdown is-hidden">
            <div id="profile-selection" class="is-flex is-flex-wrap-wrap">
            </div>
        </div>
        <div>
            <div class="is-flex is-flex-direction-column" id="messages">
            </div>

            <form class="field has-addons" id="message-form">
                <p class="control is-expanded">
                    <textarea class="textarea" placeholder="Your message" id="message-field"></textarea>
                </p>
                <p class="control">
                    <input class="button is-link" type="submit" id="send-message" disabled>
                </p>
            </form>
        </div>
    </body>
</html>
