<!--index.html-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <!--<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:5129 ws://localhost:5129 https://amiko.zirk.eu ws://amiko.zirk.eu; script-src 'self' 'unsafe-eval'">-->
        <title>Amiko</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./js/platform/browser.js"></script>
        <script src="./js/index.js"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0">
        <link rel="stylesheet" href="./node_modules/bulma/css/bulma.min.css">
        <link rel="stylesheet" href="./css/main.css">
        <link rel="stylesheet" href="./css/options/regular.css" id="user-style">
    </head>
    <body>
        <div class="modal is-active" id="login-popup">
            <div class="modal-background"></div>
            <div class="modal-content">
                <form class="field">
                    <div class="field">
                        <label class="label">Website</label>
                        <div class="control">
                            <input id="website" class="input" type="text" readonly/>
                        </div>
                    </div>
                    <div class="field">
                        <label class="label">Password</label>
                        <div class="control">
                            <input id="password" class="input" type="password" placeholder="Password">
                        </div>
                    </div>
                    <p class="control">
                        <input class="button is-link" type="submit" id="password-submit">
                    </p>
                </form>
            </div>
            <button class="modal-close is-large is-hidden" aria-label="close" id="close-login"></button>
        </div>

        <div class="modal" id="modal-preview">
            <div class="modal-background"></div>
            <div class="modal-content">
                <img src="" id="image-preview"/>
            </div>
            <button class="modal-close is-large" aria-label="close" id="close-preview"></button>
        </div>

        <template id="message-template">
            <div class="container message is-flex-grow-0">
                <div class="is-flex">
                    <div class="pfp"></div>
                    <div class="message-main">
                        <small class="date"></small>
                        <h2 class="subtitle"></h2>
                        <p class="content"></p>
                        <div class="rich-preview is-flex is-hidden"></div>
                        <div class="attachment-info is-hidden"></div>
                    </div>
                </div>
            </div>
        </template>
        <template id="profile-template">
            <button class="button profile is-flex is-flex-wrap-wrap">
                <div class="pfp"></div>
                <p></p>
            </button>
        </template>
        <nav class="navbar">
            <div class="navbar-brand">
                <button class="navbar-item" id="toggle-settings">
                    <span class="material-symbols-outlined">settings</span>
                </button>
                <button class="navbar-item" id="toggle-profile">
                    <span class="material-symbols-outlined">person</span>
                </button>
                <button class="navbar-item" id="toggle-help">
                    <span class="material-symbols-outlined">help</span>
                </button>
                <button class="navbar-item" id="toggle-debug">
                    <span class="material-symbols-outlined">bug_report</span>
                </button>
                <div class="level is-mobile">
                    <h3 class="subtitle" id="channel-title"></h3>
                </div>
            </div>
        </nav>
        <div id="settings-dropdown" class="dropdown is-hidden">
            <div>
                <fieldset class="box">
                    <legend class="label has-text-centered">Global Settings</legend>
                    <div class="select">
                        <select id="style-selection-select">
                            <option value="regular">Default</option>
                            <option value="minimalist">Minimalist</option>
                        </select>
                    </div>
                </fieldset>
                <fieldset class="box">
                    <legend class="label has-text-centered">Notification Settings</legend>
                    <div class="select">
                        <select id="notification-selection-select">
                            <option value="0">No notification</option>
                            <option value="1">Pings only</option>
                            <option value="2">All messages</option>
                        </select>
                    </div>
                    <div class="select">
                        <select id="notification-privacy-selection-select">
                            <option value="0">Show all</option>
                            <option value="1">Censor</option>
                        </select>
                    </div>
                </fieldset>
                <fieldset class="box">
                    <legend class="label has-text-centered">Channel Settings</legend>
                    <button class="button is-primary" id="export-button">Export</button>
                </fieldset>
            </div>
        </div>
        <div id="profile-dropdown" class="dropdown is-hidden">
            <div>
                <div>
                    <div class="select">
                        <select id="user-type-selection-select">
                            <option value="0">Single user</option>
                            <option value="1">Co-fronting</option>
                        </select>
                    </div>
                </div>
                <hr>
                <div id="profile-selection" class="is-flex is-flex-wrap-wrap">
                </div>
            </div>
        </div>
        <div id="help-dropdown" class="dropdown is-hidden">
            <div>
                <fieldset class="box">
                    <legend class="label has-text-centered">Formatting</legend>
                    <a href="http://markdownguide.org/cheat-sheet/" target="_blank">Markdown</a><br>
                    <p>&lt;link&gt; &gt; Don't preview an image</p>
                    <p>&lt;b:link&gt; &gt; Blur an image preview</p>
                </fieldset>
                <fieldset class="box">
                    <legend class="label has-text-centered">Credits</legend>
                    <a href="https://github.com/Xwilarg/Amiko" target="_blank">GitHub</a><br>
                    <a href="https://linear.app/xwilarg/project/amiko-e9917887575b/issues" target="_blank">Upcoming features</a>
                </fieldset>
            </div>
        </div>
        <div id="debug-dropdown" class="dropdown is-hidden">
            <div>
                <div>
                    Electron: <span id="version-electron"></span><br>
                    Node: <span id="version-node"></span><br>
                    Browser: <span id="version-browser"></span><br>
                </div>
                <div>
                    <button class="button" id="reset-conn">Reset connection</button>
                </div>
            </div>
        </div>
        <div class="is-flex">
            <div id="server-list">
                <div id="servers" class="is-flex is-flex-direction-column"></div>
            </div>
            <div id="channel-list" class="is-hidden">
                <div id="channels" class="is-flex is-flex-direction-column"></div>
            </div>
            <div id="main-screen">
                <div class="is-flex is-flex-direction-column" id="messages">
                </div>

                <form class="field has-addons container" id="message-form">
                    <p class="control">
                        <label for="attach-file" class="button" id="attach-file-container">
                            <span class="material-symbols-outlined">attach_file</span>
                            <input type="file" id="attach-file">
                        </label>
                    </p>
                    <p class="control is-expanded">
                        <textarea maxlength="3000" class="textarea" placeholder="Your message" id="message-field"></textarea>
                    </p>
                    <p class="control">
                        <button class="button is-link" type="submit" id="send-message">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </p>
                </form>
            </div>
        </div>
    </body>
</html>
